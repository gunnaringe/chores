syntax = "proto3";

package chores.v1;

option go_package = "github.com/gunnaringe/chores/gen/chores/v1;choresv1";

import "google/protobuf/timestamp.proto";

// An amount of money, always as a whole number of minor units — never a
// float, which can't represent an exact number of øre. There is one
// currency per deployment and it isn't carried here; if the app ever needs
// per-family currencies, this is the message that gains the field, and
// every amount in the API comes along for free.
message Money {
  int64 cents = 1;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_PARENT = 1;
  USER_ROLE_CHILD = 2;
}

enum IconType {
  ICON_TYPE_UNSPECIFIED = 0;
  ICON_TYPE_EMOJI = 1;
  ICON_TYPE_FONT_AWESOME = 2;
  // A Google Material Symbols icon name (fonts.google.com/icons), e.g.
  // "cleaning_services", rendered via the Material Symbols web font.
  ICON_TYPE_MATERIAL_SYMBOLS = 3;
}

// An icon shown next to a task. For ICON_TYPE_EMOJI, value is the emoji
// character(s) itself (e.g. "🧹"). For ICON_TYPE_FONT_AWESOME, value is a
// Font Awesome Free Solid icon name without the "fa-" prefix (e.g. "broom",
// rendered as the CSS classes "fa-solid fa-broom"). For
// ICON_TYPE_MATERIAL_SYMBOLS, value is a Material Symbols icon name (e.g.
// "cleaning_services").
message Icon {
  IconType type = 1;
  string value = 2;
}

message Family {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

message User {
  string id = 1;
  string family_id = 2;
  string name = 3;
  UserRole role = 4;
  google.protobuf.Timestamp created_at = 5;
  string email = 6;
  // Whether this user is bound to a login identity. Both parents and
  // children can be — a child old enough to have their own account joins
  // via an invitation exactly as a co-parent does, and their login is then
  // scoped to their own tasks and accounting. A user row created via an
  // invitation stays unbound until that invite is accepted, and a child
  // too young for an account simply stays unbound forever, acted on by a
  // parent's session or the kiosk dashboard.
  bool auth_bound = 7;
}

// ---- Schedules ------------------------------------------------------------

// Due exactly once, on `date`. Never recurs.
message OnceSchedule {
  // YYYY-MM-DD.
  string date = 1;
}

// Due on each of days_of_week, every interval_weeks weeks, counted from
// anchor_date.
message WeeklySchedule {
  // 0=Sunday..6=Saturday, matching time.Weekday. Must be non-empty.
  repeated int32 days_of_week = 1;
  // How many weeks between due weeks; 1 means every week. Must be >= 1.
  int32 interval_weeks = 2;
  // YYYY-MM-DD — the reference week interval_weeks is counted from.
  // Irrelevant when the interval is 1, but always populated so that
  // changing the interval later stays well-defined.
  string anchor_date = 3;
}

// Due whenever a raw cron expression matches — the general-purpose escape
// hatch for schedules WeeklySchedule can't express (e.g. "the 1st of every
// month").
message CronSchedule {
  // Standard 5-field cron expression (minute hour day-of-month month
  // day-of-week), e.g. "0 0 * * 1,3,5" for every Monday, Wednesday and
  // Friday.
  string expression = 1;
}

// When a task is due. Exactly one kind is set — which is the point of
// modelling it as a oneof rather than a mode enum beside five loose
// fields, where nothing structural stopped a one-off task from also
// carrying a cron expression.
message Schedule {
  oneof kind {
    OnceSchedule once = 1;
    WeeklySchedule weekly = 2;
    CronSchedule cron = 3;
  }
}

// ---- Tasks ----------------------------------------------------------------
//
// Tasks come in two halves, and the distinction is the whole design:
//
//   Task            the recurring definition — a rule ("every Monday"), what
//                   it pays, who it applies to. Holds no state about any
//                   particular day. Effectively a template, though it keeps
//                   the name the UI and the family use for it.
//   TaskOccurrence  one instance of that definition: one task, one child,
//                   one date.
//
// TaskOccurrence repeats the definition's title, description, icon and
// amount rather than referring back to them. That duplication is load-
// bearing and must not be "tidied up" into a join: it is what lets a task
// be renamed, repriced or deleted without rewriting what already happened.
// Resolving those fields from the Task at read time is precisely the bug
// this shape exists to prevent — it once let deleting a task erase the
// earnings behind payouts already made, driving a child's balance negative.
//
// The one field deliberately NOT copied is child_name, which resolves live:
// correcting the spelling of a person's name should fix it everywhere,
// unlike a task rename, which must not reach backwards.

message Task {
  // 5 was price_cents (int64), superseded by `price`.
  // 6 was schedule (a raw cron string), 11-14 were repeat_mode,
  // days_of_week, repeat_interval_weeks and start_date — all superseded by
  // the `schedule` message.
  reserved 5, 6, 11, 12, 13, 14;

  string id = 1;
  string family_id = 2;
  string title = 3;
  string description = 4;
  bool active = 7;
  google.protobuf.Timestamp created_at = 8;
  // The children this task applies to. Always non-empty for a task created
  // through the API.
  repeated string child_ids = 9;
  // Optional icon shown next to the task. Absent means no icon.
  Icon icon = 10;
  // What completing this task earns.
  Money price = 15;
  Schedule schedule = 16;
  // Set once the task has been deleted. Deletion is soft: the row survives
  // so that the occurrences it already produced keep rendering, and so the
  // schedule remains available to reconstruct past occurrences that were
  // never completed. A deleted task generates no occurrences on or after
  // this date, is excluded from ListTasks, and can't be edited or
  // completed. Nothing currently returns a deleted task, so this is unset
  // on every Task the API hands out today.
  google.protobuf.Timestamp deleted_at = 17;
}

// One instance of a task, for one child, on one calendar date — the single
// unit the app actually deals in. Today lists them, History lists them,
// earnings sum them, and the kiosk ticks them off.
//
// An occurrence exists as a stored row once something has been recorded
// about it (today: being completed). Otherwise it's derived on the fly from
// its task's schedule and carries no id. Either way the fields below are
// populated identically, so a caller never has to care which it is.
message TaskOccurrence {
  string id = 1;
  string family_id = 2;
  // The task this came from. Stays populated after that task is deleted —
  // it's a historical reference, not a foreign key.
  string task_id = 3;
  string child_id = 4;
  // YYYY-MM-DD.
  string due_date = 5;

  // How the task read when this occurrence was recorded. Copied onto the
  // stored row rather than joined at read time, so that renaming or
  // repricing a task never rewrites what already happened.
  string title = 6;
  string description = 7;
  Icon icon = 8;
  // For a completed occurrence, what the child earned — fixed at the moment
  // it was completed and never revised afterwards. For one not yet
  // completed, the task's price as it currently stands.
  Money amount = 9;

  // Resolved live from the child's user row rather than frozen with the
  // rest: fixing the spelling of a person's name should correct it
  // everywhere, unlike a task rename, which must not rewrite history.
  string child_name = 10;

  // Unset while the occurrence is due but not completed — the single
  // source of truth for whether it's done.
  google.protobuf.Timestamp completed_at = 11;
}

message Payout {
  // 4 was amount_cents (int64), superseded by `amount`.
  reserved 4;

  string id = 1;
  string child_id = 2;
  string family_id = 3;
  bool full_payout = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
  Money amount = 8;
}

message ChildSummary {
  // 2-5 and 7-8 were the *_cents int64 variants of the Money fields below.
  reserved 2, 3, 4, 5, 7, 8;

  User child = 1;
  google.protobuf.Timestamp last_payout_at = 6;

  Money earned_last_7_days = 9;
  Money balance = 10;
  Money total_earned = 11;
  Money total_paid_out = 12;
  Money earned_today = 13;
  // Sum of completions due since the current calendar week's Monday
  // (through today), matching the Monday-first week the UI shows
  // elsewhere — distinct from earned_last_7_days, which is a rolling
  // window rather than a calendar week.
  Money earned_this_week = 14;
}

// ---- Families -------------------------------------------------------------

message CreateFamilyRequest {
  string name = 1;
  // The caller is automatically created as the founding parent and bound
  // to their login identity. This is their display name; if empty, their
  // login profile's name (or email) is used.
  string parent_name = 2;
}
message CreateFamilyResponse {
  Family family = 1;
}

message ListFamiliesRequest {}
message ListFamiliesResponse {
  repeated Family families = 1;
}

// Reports whether the family's Today-tab kiosk dashboard is set up, and its
// key if so — a parent can come back and view/share it again, unlike an
// invitation token, which is only ever returned once.
message GetDashboardConfigRequest {
  string family_id = 1;
}
message GetDashboardConfigResponse {
  bool enabled = 1;
  // Empty when not enabled.
  string dashboard_key = 2;
}

// Generates a new dashboard key for the family, replacing any existing one
// (which immediately stops working — a kiosk showing the old key has to be
// re-entered). The key is a bearer credential: whoever has it can view the
// Today tab and mark tasks done for any child in the family, with no login
// of their own. See internal/server/dashboard.go for exactly what it does
// and doesn't unlock.
message SetupDashboardRequest {
  string family_id = 1;
}
message SetupDashboardResponse {
  string dashboard_key = 1;
}

message DisableDashboardRequest {
  string family_id = 1;
}
message DisableDashboardResponse {}

// Deletes the family outright: every user, task, occurrence, payout,
// invitation, and push subscription tied to it, via cascading foreign
// keys. Any parent in the family may do this — there's no "last parent"
// restriction here, unlike LeaveFamily, since deleting is the family's own
// end rather than one member stepping away from an otherwise-continuing one.
message DeleteFamilyRequest {
  string family_id = 1;
}
message DeleteFamilyResponse {}

message UpdateFamilyRequest {
  string family_id = 1;
  string name = 2;
}
message UpdateFamilyResponse {
  Family family = 1;
}

// ---- Users ----------------------------------------------------------------

message CreateUserRequest {
  string family_id = 1;
  string name = 2;
  UserRole role = 3;
}
message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {
  string family_id = 1;
}
message ListUsersResponse {
  repeated User users = 1;
}

// Renaming is self-service only — a bound login can rename its own user
// row and no one else's, even a parent renaming a child.
message UpdateUserRequest {
  string user_id = 1;
  string name = 2;
}
message UpdateUserResponse {
  User user = 1;
}

// A parent removing themselves from the family. Only ever themselves — a
// bound login can't leave on another parent's behalf — and only when at
// least one other parent will remain, so a family is never left without
// one. To get rid of the last parent, delete the family instead.
message LeaveFamilyRequest {
  string user_id = 1;
}
message LeaveFamilyResponse {}

// A parent removing a child from the family. This cascades away the
// child's task assignments, occurrence history, and payout history along
// with their user row, so it's meant to be used deliberately (the UI
// confirms with a typed word, not just a click) rather than for routine
// cleanup.
message RemoveChildRequest {
  string child_id = 1;
}
message RemoveChildResponse {}

// ---- Tasks ----------------------------------------------------------------

message CreateTaskRequest {
  // 4 was price_cents, 5 was schedule (raw cron), 8-11 were repeat_mode,
  // days_of_week, repeat_interval_weeks and start_date.
  reserved 4, 5, 8, 9, 10, 11;

  string family_id = 1;
  string title = 2;
  string description = 3;
  // Which children this task applies to. Must be non-empty and every id
  // must be a child in family_id.
  repeated string child_ids = 6;
  // Optional icon shown next to the task. Omit for no icon.
  Icon icon = 7;
  Money price = 12;
  // Required. Exactly one kind must be set, and populated consistently —
  // see the per-kind field comments.
  Schedule schedule = 13;
}
message CreateTaskResponse {
  Task task = 1;
}

message UpdateTaskRequest {
  // 4 was price_cents, 5 was schedule (raw cron), 9-12 were repeat_mode,
  // days_of_week, repeat_interval_weeks and start_date.
  reserved 4, 5, 9, 10, 11, 12;

  string task_id = 1;
  string title = 2;
  string description = 3;
  bool active = 6;
  // Replaces the task's full set of assigned children. Must be non-empty.
  repeated string child_ids = 7;
  // Optional icon shown next to the task. Omit for no icon.
  Icon icon = 8;
  Money price = 13;
  Schedule schedule = 14;
}
message UpdateTaskResponse {
  Task task = 1;
}

// Soft-deletes the task: it stops generating occurrences from today
// onwards and disappears from ListTasks, but the occurrences it already
// produced — completed and merely due alike — remain, along with the
// earnings they represent. Deleting a task therefore never moves a child's
// balance.
message DeleteTaskRequest {
  string task_id = 1;
}
message DeleteTaskResponse {}

message ListTasksRequest {
  string family_id = 1;
}
message ListTasksResponse {
  repeated Task tasks = 1;
}

// Lists the occurrences of tasks due between two dates (inclusive),
// completed and not. Without child_id, returns occurrences for every child
// in the family (a bound child's login always gets only their own,
// regardless of what's requested). An occurrence recorded against a task
// that no longer generates it — since paused, or deleted — is still
// included, so history is never lost by pausing or deleting a task.
message ListTaskOccurrencesRequest {
  string family_id = 1;
  string start_date = 2; // YYYY-MM-DD; optional, defaults to the earliest
                          // date any occurrence in the family could exist from
  string end_date = 3;   // YYYY-MM-DD; optional, defaults to today
  string child_id = 4;   // optional filter
  // Case-insensitive substring match against the occurrence's title or the
  // child's name. Optional; when set, start_date/end_date are typically
  // left unset so the search spans the family's whole history.
  string search = 5;
  // Page size; when unset (<= 0), all matching occurrences are returned
  // unpaginated. A max applies when set.
  int32 limit = 6;
  int32 offset = 7;
}
message ListTaskOccurrencesResponse {
  repeated TaskOccurrence occurrences = 1;
  // True if more occurrences exist beyond this page (offset + limit) — only
  // meaningful when a limit was set on the request.
  bool has_more = 2;
}

message CompleteTaskRequest {
  string task_id = 1;
  string child_id = 2;
  string due_date = 3; // YYYY-MM-DD, defaults to today if empty
}
message CompleteTaskResponse {
  TaskOccurrence occurrence = 1;
}

message UncompleteTaskRequest {
  string task_id = 1;
  string child_id = 2;
  string due_date = 3;
}
message UncompleteTaskResponse {}

// ---- Accounting -----------------------------------------------------------

message GetChildSummaryRequest {
  string child_id = 1;
}
message GetChildSummaryResponse {
  ChildSummary summary = 1;
}

message ListChildSummariesRequest {
  string family_id = 1;
}
message ListChildSummariesResponse {
  repeated ChildSummary summaries = 1;
}

message CreatePayoutRequest {
  // 3 was amount_cents (int64), superseded by `amount`.
  reserved 3;

  string child_id = 1;
  // If full_payout is true, amount is ignored and the child's full
  // outstanding balance is paid out.
  bool full_payout = 2;
  string note = 4;
  Money amount = 5;
}
message CreatePayoutResponse {
  Payout payout = 1;
}

message ListPayoutsRequest {
  string family_id = 1;
  string child_id = 2; // optional filter
}
message ListPayoutsResponse {
  repeated Payout payouts = 1;
}

// ---- Membership and invitations -------------------------------------------

// One family a login identity is bound to as a specific family member.
// Usually there's exactly one (a parent belongs to one household), but a
// child can be bound to more than one — e.g. a child who lives in two
// households, each running its own chores/allowance independently.
message Membership {
  User user = 1;
  Family family = 2;
}

// GetMyMembership resolves the caller's login identity to every family
// member row it's bound to. A freshly logged-in identity with none yet
// (hasn't created or joined a family) reports unbound.
message GetMyMembershipRequest {}
message GetMyMembershipResponse {
  bool bound = 1;
  repeated Membership memberships = 2;
}

// An invitation grants whoever holds its (unguessable, single-use) token
// the ability to bind their login identity to user_id — an unclaimed
// parent or child slot in family_id. The token stays visible (via
// ListInvitations) for as long as the invitation is still pending, so it
// can be shared/copied at any time before it's accepted — once accepted_at
// is set, token is omitted since it's no longer usable.
message Invitation {
  // 5 was email, dropped along with the invite form's email field: an
  // invitation was never matched against an address, so recording one was
  // decoration.
  reserved 5;

  string id = 1;
  string family_id = 2;
  string user_id = 3;
  string user_name = 4;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp accepted_at = 8;
  UserRole role = 9;
  string token = 10;
}

message CreateInvitationRequest {
  // 3 was email — see Invitation.
  reserved 3;

  string family_id = 1;
  // Display name for the new slot this invitation grants access to.
  string name = 2;
  // Must be PARENT or CHILD. Only parents may create invitations of either
  // kind.
  UserRole role = 4;
}
message CreateInvitationResponse {
  Invitation invitation = 1;
  string token = 2;
  // Convenience relative path the frontend can turn into a shareable link,
  // e.g. "/invite/accept?token=...".
  string accept_path = 3;
}

message ListInvitationsRequest {
  string family_id = 1;
}
message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message RevokeInvitationRequest {
  string invitation_id = 1;
}
message RevokeInvitationResponse {}

message AcceptInvitationRequest {
  string token = 1;
}
message AcceptInvitationResponse {
  User user = 1;
  Family family = 2;
}

// ---- Push notifications ---------------------------------------------------

// A browser's Web Push subscription (from PushManager.subscribe()), tied to
// whichever user was active in this browser when notifications were
// enabled. One row per browser/device — re-subscribing with the same
// endpoint (e.g. re-enabling after disabling) replaces it rather than
// duplicating it.
message PushSubscription {
  string endpoint = 1;
  string p256dh = 2;
  string auth = 3;
}

// Returns the public key the frontend needs to create a subscription
// (PushManager.subscribe({applicationServerKey})). Not tied to any family or
// login — it's the same for the whole deployment.
message GetPushConfigRequest {}
message GetPushConfigResponse {
  // Empty if the server has no VAPID keys configured, meaning push isn't
  // available at all (the config page should say so rather than offering a
  // dead toggle).
  string vapid_public_key = 1;
}

message SubscribeToPushRequest {
  string user_id = 1;
  PushSubscription subscription = 2;
}
message SubscribeToPushResponse {}

// Idempotent: removing an endpoint that was never subscribed (or already
// removed) is not an error.
message UnsubscribeFromPushRequest {
  string endpoint = 1;
}
message UnsubscribeFromPushResponse {}

service ChoresService {
  rpc CreateFamily(CreateFamilyRequest) returns (CreateFamilyResponse);
  rpc ListFamilies(ListFamiliesRequest) returns (ListFamiliesResponse);
  rpc DeleteFamily(DeleteFamilyRequest) returns (DeleteFamilyResponse);
  rpc UpdateFamily(UpdateFamilyRequest) returns (UpdateFamilyResponse);
  rpc GetDashboardConfig(GetDashboardConfigRequest) returns (GetDashboardConfigResponse);
  rpc SetupDashboard(SetupDashboardRequest) returns (SetupDashboardResponse);
  rpc DisableDashboard(DisableDashboardRequest) returns (DisableDashboardResponse);

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc LeaveFamily(LeaveFamilyRequest) returns (LeaveFamilyResponse);
  rpc RemoveChild(RemoveChildRequest) returns (RemoveChildResponse);

  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ListTaskOccurrences(ListTaskOccurrencesRequest) returns (ListTaskOccurrencesResponse);

  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc UncompleteTask(UncompleteTaskRequest) returns (UncompleteTaskResponse);

  rpc GetChildSummary(GetChildSummaryRequest) returns (GetChildSummaryResponse);
  rpc ListChildSummaries(ListChildSummariesRequest) returns (ListChildSummariesResponse);

  rpc CreatePayout(CreatePayoutRequest) returns (CreatePayoutResponse);
  rpc ListPayouts(ListPayoutsRequest) returns (ListPayoutsResponse);

  rpc GetMyMembership(GetMyMembershipRequest) returns (GetMyMembershipResponse);
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);

  rpc GetPushConfig(GetPushConfigRequest) returns (GetPushConfigResponse);
  rpc SubscribeToPush(SubscribeToPushRequest) returns (SubscribeToPushResponse);
  rpc UnsubscribeFromPush(UnsubscribeFromPushRequest) returns (UnsubscribeFromPushResponse);
}
