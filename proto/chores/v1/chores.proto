syntax = "proto3";

package chores.v1;

option go_package = "github.com/gunnaringe/chores/gen/chores/v1;choresv1";

import "google/protobuf/timestamp.proto";

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_PARENT = 1;
  USER_ROLE_CHILD = 2;
}

message Family {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
}

message User {
  string id = 1;
  string family_id = 2;
  string name = 3;
  UserRole role = 4;
  google.protobuf.Timestamp created_at = 5;
  string email = 6;
  // Whether this user is bound to a login identity (only ever true for
  // parents, since children don't log in themselves). A parent row created
  // via an invitation stays unbound until the invite is accepted.
  bool auth_bound = 7;
}

message Task {
  string id = 1;
  string family_id = 2;
  string title = 3;
  string description = 4;
  int64 price_cents = 5;
  // Standard 5-field cron expression (minute hour day-of-month month day-of-week),
  // e.g. "0 0 * * 1,3,5" for every Monday, Wednesday and Friday.
  string schedule = 6;
  bool active = 7;
  google.protobuf.Timestamp created_at = 8;
  // The children this task applies to. Always non-empty for a task created
  // through the API.
  repeated string child_ids = 9;
  // Optional emoji or short icon shown next to the task, e.g. "🧹".
  string icon = 10;
}

message TaskCompletion {
  string id = 1;
  string task_id = 2;
  string child_id = 3;
  string family_id = 4;
  // The calendar date (YYYY-MM-DD) the task instance was due/completed for.
  string due_date = 5;
  int64 amount_cents = 6;
  google.protobuf.Timestamp completed_at = 7;
}

message Payout {
  string id = 1;
  string child_id = 2;
  string family_id = 3;
  int64 amount_cents = 4;
  bool full_payout = 5;
  string note = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ChildSummary {
  User child = 1;
  int64 earned_last_7_days_cents = 2;
  int64 balance_cents = 3;
  int64 total_earned_cents = 4;
  int64 total_paid_out_cents = 5;
  google.protobuf.Timestamp last_payout_at = 6;
}

// Represents one occurrence of a recurring task, for one of the children it
// applies to, on a given date, joined with whether it has already been
// completed. A task assigned to several children produces one occurrence
// per assigned child for each due date.
message TaskOccurrence {
  Task task = 1;
  string due_date = 2;
  bool completed = 3;
  TaskCompletion completion = 4;
  string child_id = 5;
  string child_name = 6;
}

message CreateFamilyRequest {
  string name = 1;
  // When auth is enabled, the caller is automatically created as the
  // founding parent and bound to their login identity. This is their
  // display name; if empty, their login profile's name (or email) is used.
  // Ignored in local-testing mode (no auth configured).
  string parent_name = 2;
}
message CreateFamilyResponse {
  Family family = 1;
}

message ListFamiliesRequest {}
message ListFamiliesResponse {
  repeated Family families = 1;
}

message CreateUserRequest {
  string family_id = 1;
  string name = 2;
  UserRole role = 3;
}
message CreateUserResponse {
  User user = 1;
}

message ListUsersRequest {
  string family_id = 1;
}
message ListUsersResponse {
  repeated User users = 1;
}

message CreateTaskRequest {
  string family_id = 1;
  string title = 2;
  string description = 3;
  int64 price_cents = 4;
  string schedule = 5;
  // Which children this task applies to. Must be non-empty and every id
  // must be a child in family_id.
  repeated string child_ids = 6;
  // Optional emoji or short icon shown next to the task, e.g. "🧹".
  string icon = 7;
}
message CreateTaskResponse {
  Task task = 1;
}

message UpdateTaskRequest {
  string task_id = 1;
  string title = 2;
  string description = 3;
  int64 price_cents = 4;
  string schedule = 5;
  bool active = 6;
  // Replaces the task's full set of assigned children. Must be non-empty.
  repeated string child_ids = 7;
  // Optional emoji or short icon shown next to the task, e.g. "🧹".
  string icon = 8;
}
message UpdateTaskResponse {
  Task task = 1;
}

message DeleteTaskRequest {
  string task_id = 1;
}
message DeleteTaskResponse {}

message ListTasksRequest {
  string family_id = 1;
}
message ListTasksResponse {
  repeated Task tasks = 1;
}

// Lists the due occurrences of active tasks between two dates (inclusive),
// indicating which are already completed. Without child_id, returns
// occurrences for every child in the family (a bound child's login always
// gets only their own, regardless of what's requested).
message ListTaskOccurrencesRequest {
  string family_id = 1;
  string start_date = 2; // YYYY-MM-DD
  string end_date = 3;   // YYYY-MM-DD
  string child_id = 4;   // optional filter
}
message ListTaskOccurrencesResponse {
  repeated TaskOccurrence occurrences = 1;
}

message CompleteTaskRequest {
  string task_id = 1;
  string child_id = 2;
  string due_date = 3; // YYYY-MM-DD, defaults to today if empty
}
message CompleteTaskResponse {
  TaskCompletion completion = 1;
}

message UncompleteTaskRequest {
  string task_id = 1;
  string child_id = 2;
  string due_date = 3;
}
message UncompleteTaskResponse {}

message ListTaskCompletionsRequest {
  string family_id = 1;
  string child_id = 2; // optional filter
}
message ListTaskCompletionsResponse {
  repeated TaskCompletion completions = 1;
}

message GetChildSummaryRequest {
  string child_id = 1;
}
message GetChildSummaryResponse {
  ChildSummary summary = 1;
}

message ListChildSummariesRequest {
  string family_id = 1;
}
message ListChildSummariesResponse {
  repeated ChildSummary summaries = 1;
}

message CreatePayoutRequest {
  string child_id = 1;
  // If full_payout is true, amount_cents is ignored and the child's full
  // outstanding balance is paid out.
  bool full_payout = 2;
  int64 amount_cents = 3;
  string note = 4;
}
message CreatePayoutResponse {
  Payout payout = 1;
}

message ListPayoutsRequest {
  string family_id = 1;
  string child_id = 2; // optional filter
}
message ListPayoutsResponse {
  repeated Payout payouts = 1;
}

// GetMyMembership resolves the caller's login identity (when auth is
// enabled) to the family member it's bound to, if any. In local-testing
// mode (no auth configured) it always reports unbound, since there is no
// login identity to resolve.
message GetMyMembershipRequest {}
message GetMyMembershipResponse {
  bool bound = 1;
  User user = 2;
  Family family = 3;
}

// An invitation grants whoever holds its (unguessable, single-use) token
// the ability to bind their login identity to user_id — an unclaimed
// parent or child slot in family_id. The token itself is only ever
// returned once, from CreateInvitation.
message Invitation {
  string id = 1;
  string family_id = 2;
  string user_id = 3;
  string user_name = 4;
  string email = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp accepted_at = 8;
  UserRole role = 9;
}

message CreateInvitationRequest {
  string family_id = 1;
  // Display name for the new slot this invitation grants access to.
  string name = 2;
  // Informational only (shown in the pending-invites list) — accepting an
  // invitation is not restricted to any particular login's email address.
  string email = 3;
  // Must be PARENT or CHILD. Only parents may create invitations of either
  // kind.
  UserRole role = 4;
}
message CreateInvitationResponse {
  Invitation invitation = 1;
  string token = 2;
  // Convenience relative path the frontend can turn into a shareable link,
  // e.g. "/invite/accept?token=...".
  string accept_path = 3;
}

message ListInvitationsRequest {
  string family_id = 1;
}
message ListInvitationsResponse {
  repeated Invitation invitations = 1;
}

message RevokeInvitationRequest {
  string invitation_id = 1;
}
message RevokeInvitationResponse {}

message AcceptInvitationRequest {
  string token = 1;
}
message AcceptInvitationResponse {
  User user = 1;
  Family family = 2;
}

service ChoresService {
  rpc CreateFamily(CreateFamilyRequest) returns (CreateFamilyResponse);
  rpc ListFamilies(ListFamiliesRequest) returns (ListFamiliesResponse);

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ListTaskOccurrences(ListTaskOccurrencesRequest) returns (ListTaskOccurrencesResponse);

  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc UncompleteTask(UncompleteTaskRequest) returns (UncompleteTaskResponse);
  rpc ListTaskCompletions(ListTaskCompletionsRequest) returns (ListTaskCompletionsResponse);

  rpc GetChildSummary(GetChildSummaryRequest) returns (GetChildSummaryResponse);
  rpc ListChildSummaries(ListChildSummariesRequest) returns (ListChildSummariesResponse);

  rpc CreatePayout(CreatePayoutRequest) returns (CreatePayoutResponse);
  rpc ListPayouts(ListPayoutsRequest) returns (ListPayoutsResponse);

  rpc GetMyMembership(GetMyMembershipRequest) returns (GetMyMembershipResponse);
  rpc CreateInvitation(CreateInvitationRequest) returns (CreateInvitationResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
}
