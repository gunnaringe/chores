name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      # Again with the server's clock three years ahead, so a test that only
      # passes while today is before one of its fixed dates fails now rather
      # than on that date (see TestMain in internal/server/main_test.go).
      - run: go test -count=1 ./internal/server/
        env:
          CHORES_TEST_SHIFT_DAYS: "1100"
