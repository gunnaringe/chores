<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chores</title>
<link rel="stylesheet" href="/app.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chores" />
</head>
<body>
<div id="app">
  <main class="content no-tabbar">
    <div class="hero">
      <img src="/icons/logo.png" alt="" width="96" height="96" class="logo" />
      <h1 id="app-title"></h1>
      <p id="login-subtitle"></p>
      <button class="block" id="login-btn" onclick="location.href='/auth/login'"></button>
      <div style="margin-top:22px;">
        <select id="lang-switcher" style="width:auto;" aria-label="Language"></select>
      </div>
    </div>
  </main>
</div>
<script src="/i18n.js"></script>
<script>
  document.getElementById("app-title").textContent = window.APP_NAME;
  document.getElementById("login-subtitle").textContent = t("login.subtitle");
  document.getElementById("login-btn").textContent = t("login.button");

  const switcher = document.getElementById("lang-switcher");
  switcher.setAttribute("aria-label", t("lang.label"));
  switcher.innerHTML = window.LANGUAGES.map(
    (l) => `<option value="${l.code}"${l.code === getLang() ? " selected" : ""}>${l.label}</option>`
  ).join("");
  switcher.addEventListener("change", (e) => {
    setLang(e.target.value);
    location.reload();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</body>
</html>
