<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chores</title>
<!-- Link-preview metadata for Facebook, Slack, iMessage et al. Filled in
     per request by Pages.Render in web/og.go, because what a crawler should
     read depends on which hostname it asked for: the tags are localized by
     host (see the og-locale-hosts setting) and their absolute URLs are built
     from the request's own origin, so no deployment's hostnames appear in
     this repo. Crawlers are served login.html — an unauthenticated "/" never
     reaches the app shell, see Gate in internal/auth — and they don't run
     JavaScript, so anything they should read has to be literal HTML: the
     visible copy below is filled in by i18n.js at runtime and is empty as
     far as a scraper is concerned. -->
<!-- og:meta -->
<link rel="stylesheet" href="/app.css" />
<meta name="theme-color" content="#f2f3f7" id="theme-color-meta" />
<script src="/theme.js"></script>
<!-- The icon font is self-hosted and declared in app.css (font-display:
     block); preloading it starts the ~460KB download before app.css is parsed. -->
<link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
<script src="/icon-probe.js"></script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chores" />
</head>
<body>
<div id="app">
  <main class="content no-tabbar welcome">
    <!-- The hero is deliberately the whole first screen and nothing else:
         someone who already uses the app should never have to read past it,
         or scroll, to find the same Log in button that has always been here.
         Everything explaining the app lives below the fold. -->
    <header class="welcome-hero">
      <img src="/icons/logo.png" alt="" width="96" height="96" class="logo" />
      <h1 id="app-title"></h1>
      <p id="login-tagline"></p>
      <button class="block" id="login-btn"></button>
      <a id="dashboard-link" class="welcome-dashboard-link" href="/dashboard"></a>
      <div class="welcome-lang">
        <select id="lang-switcher" style="width:auto;"></select>
      </div>
    </header>

    <section class="welcome-section">
      <h2 id="how-heading"></h2>
      <ol class="steps" id="steps"></ol>
    </section>

    <section class="welcome-section">
      <div class="shots" id="shots"></div>
    </section>

    <section class="welcome-section">
      <div class="card">
        <h2 id="extras-heading"></h2>
        <p id="extras-body" style="margin:0;"></p>
      </div>
    </section>

    <section class="welcome-section">
      <div class="card">
        <h2 id="integrations-heading"></h2>
        <ul class="welcome-integrations">
          <li><a id="ha-link" href="https://github.com/gunnaringe/chores-homeassistant" rel="noopener">Home Assistant</a>: <span id="ha-body"></span></li>
          <li><a id="kindle-link" href="https://github.com/gunnaringe/chores-kindle" rel="noopener">Kindle</a>: <span id="kindle-body"></span></li>
        </ul>
      </div>
    </section>

    <section class="welcome-section welcome-cta">
      <h2 id="cta-heading"></h2>
      <button class="block" id="login-btn-2"></button>
    </section>

    <footer class="welcome-footer">
      <h2 id="about-heading"></h2>
      <p>
        <a id="source-link" href="https://github.com/gunnaringe/chores" rel="noopener">Source on GitHub</a>
        ·
        <a id="license-link" href="https://github.com/gunnaringe/chores/blob/main/LICENSE" rel="noopener">Apache License 2.0</a>
        ·
        <a id="privacy-link" href="/privacy.html">Privacy policy</a>
      </p>
      <p id="hosting"></p>
      <h2 id="tech-stack-heading"></h2>
      <ul id="tech-stack"></ul>
      <p id="built-with"></p>
      <p id="disclaimer" class="disclaimer"></p>
    </footer>
  </main>
</div>
<script src="/i18n.js"></script>
<script src="/login.js"></script>
</body>
</html>
