<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover lets the page paint into the notch/home-indicator
     areas; app.css pads past them with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chores</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="/app.css" />
<!-- display=block: Material Symbols are rendered as ligature text, so the
     default swap behaviour flashes raw names ("expand_more") until the font
     lands. Blocking briefly shows nothing instead of showing nonsense —
     but only once this stylesheet itself has loaded and registered the
     font-face; until then the browser doesn't know to block at all. The
     script below covers that gap. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block" />
<script>
  // Belt-and-braces for the font-display:block above: if this stylesheet's
  // own request is slow, blocked (ad blocker, restrictive network), or the
  // font file itself hasn't arrived yet, "Material Symbols Outlined" isn't
  // a font the browser knows about yet, so display:block has nothing to
  // block — every icon renders as its literal ligature name ("edit_note")
  // instead of a glyph the instant this HTML parses, which is uglier and
  // more confusing than a blank icon tile. icons-loading (see app.css)
  // hides icon glyphs until document.fonts confirms the font usable, with
  // a timeout so a font that never arrives doesn't hide icons forever.
  document.documentElement.classList.add("icons-loading");
  (function () {
    var reveal = function () {
      document.documentElement.classList.remove("icons-loading");
    };
    if (window.FontFace && document.fonts) {
      document.fonts.load('24px "Material Symbols Outlined"').then(reveal, reveal);
      setTimeout(reveal, 3000);
    } else {
      reveal();
    }
  })();
</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chores" />
</head>
<body>
<div id="app"></div>
<script src="/i18n.js"></script>
<script>
  applyAppName();
</script>
<script src="/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</body>
</html>
