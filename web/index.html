<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover lets the page paint into the notch/home-indicator
     areas; app.css pads past them with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chores</title>
<!-- Link-preview metadata for Facebook, Slack, iMessage et al. Filled in
     per request by Pages.Render in web/og.go, because what a crawler should
     read depends on which hostname it asked for: the tags are localized by
     host (see the og-locale-hosts setting) and their absolute URLs are built
     from the request's own origin, so no deployment's hostnames appear in
     this repo. Crawlers are served login.html — an unauthenticated "/" never
     reaches the app shell, see Gate in internal/auth — and they don't run
     JavaScript, so anything they should read has to be literal HTML: the
     visible copy below is filled in by i18n.js at runtime and is empty as
     far as a scraper is concerned. -->
<!-- og:meta -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="/app.css" />
<meta name="theme-color" content="#f2f3f7" id="theme-color-meta" />
<script>
  // Applies a stored theme choice (Settings > Theme) before first paint, so
  // the app never flashes its default theme first on a device that picked
  // something else — same reasoning as icons-loading below, just for
  // color-scheme instead of icon glyphs. This is a standalone copy of
  // applyTheme() in app.js: that file loads too late in <body> to beat
  // paint, and login.html needs the exact same logic, so it's duplicated
  // rather than shared. Keep all three in step.
  (function () {
    var theme = localStorage.getItem("chores.theme");
    if (theme) document.documentElement.setAttribute("data-theme", theme);
    var meta = document.getElementById("theme-color-meta");
    if (meta) meta.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
  })();
</script>
<!-- display=block: Material Symbols are rendered as ligature text, so the
     default swap behaviour flashes raw names ("expand_more") until the font
     lands. Blocking briefly shows nothing instead of showing nonsense —
     but only once this stylesheet itself has loaded and registered the
     font-face; until then the browser doesn't know to block at all. The
     script below covers that gap. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block" />
<script>
  // Belt-and-braces for the font-display:block above. Material Symbols are
  // ligature *text*: an icon is the literal word "edit_note" until the font
  // arrives and collapses it to one glyph. So a font that never arrives
  // doesn't degrade to a missing icon, it degrades to that word, at full
  // text width, spilling across the layout and swallowing taps meant for
  // its neighbours. icons-loading (see app.css) hides glyphs until we know
  // which case we're in; icons-unavailable is the terminal fallback.
  //
  // Deciding that needs a measurement, not the Font Loading API. When the
  // Google Fonts stylesheet is blocked outright (ad blocker, filtering DNS,
  // captive network) no @font-face is ever registered — and an unregistered
  // family counts as an available *system* font, so fonts.load() resolves
  // and fonts.check() returns true while every icon would still paint as
  // its name. Both report success for the one case that most needs
  // catching, which is why this script measures a real ligature instead.
  //
  // login.html carries a copy of this script: it has to be inline and in
  // <head> to beat the first paint, so the two can't share a file. Keep
  // them in step.
  document.documentElement.classList.add("icons-loading");
  (function () {
    var root = document.documentElement;
    var FONT = '24px "Material Symbols Outlined"';

    // With the font, "settings" is a single ~24px glyph; without it the word
    // runs 60px+. Under 2em means the ligature actually substituted.
    function ligaturesRender() {
      var probe = document.createElement("span");
      probe.textContent = "settings";
      // Inline styles rather than the .material-symbols-outlined class, so
      // this measures the font itself and not whether app.css has landed.
      probe.style.cssText =
        "position:absolute;top:0;left:-9999px;visibility:hidden;white-space:nowrap;" +
        "font-family:'Material Symbols Outlined';font-size:24px;line-height:1;";
      document.body.appendChild(probe);
      var width = probe.getBoundingClientRect().width;
      document.body.removeChild(probe);
      return width > 0 && width < 48;
    }

    // Called from several places and deliberately idempotent, so a font that
    // turns up late still upgrades the page out of the fallback.
    function settle() {
      if (!document.body) {
        document.addEventListener("DOMContentLoaded", settle);
        return;
      }
      // Put the fallback class on before taking icons-loading off, or the
      // raw names paint for a frame in between.
      root.classList.toggle("icons-unavailable", !ligaturesRender());
      root.classList.remove("icons-loading");
    }

    if (window.FontFace && document.fonts) {
      document.fonts.load(FONT).then(settle, settle);
      document.fonts.ready.then(settle, settle);
      // Backstop: neither promise is guaranteed to settle on every browser.
      setTimeout(settle, 3000);
    } else {
      settle();
    }
  })();
</script>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chores" />
</head>
<body>
<div id="app"></div>
<script src="/i18n.js"></script>
<script>
  applyAppName();
</script>
<script src="/qrcode.js"></script>
<script src="/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  }
</script>
</body>
</html>
