<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover lets the page paint into the notch/home-indicator
     areas; app.css pads past them with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chores</title>
<!-- Link-preview metadata for Facebook, Slack, iMessage et al. Filled in
     per request by Pages.Render in web/og.go, because what a crawler should
     read depends on which hostname it asked for: the tags are localized by
     host (see the og-locale-hosts setting) and their absolute URLs are built
     from the request's own origin, so no deployment's hostnames appear in
     this repo. Crawlers are served login.html — an unauthenticated "/" never
     reaches the app shell, see Gate in internal/auth — and they don't run
     JavaScript, so anything they should read has to be literal HTML: the
     visible copy below is filled in by i18n.js at runtime and is empty as
     far as a scraper is concerned. -->
<!-- og:meta -->
<link rel="stylesheet" href="/app.css" />
<meta name="theme-color" content="#f2f3f7" id="theme-color-meta" />
<script src="/theme.js"></script>
<!-- The icon font is self-hosted and declared in app.css (font-display:
     block); preloading it starts the ~460KB download before app.css is parsed. -->
<link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
<script src="/icon-probe.js"></script>
<!-- The app is ES modules under app/ (entry: app/main.js, loaded at the end
     of <body>). Without these the browser only discovers each module after
     parsing the one that imports it, a request chain several round trips
     deep on a first visit; web/assets_test.go keeps the list complete. -->
<link rel="modulepreload" href="/app/api.js" />
<link rel="modulepreload" href="/app/balance.js" />
<link rel="modulepreload" href="/app/dashboard.js" />
<link rel="modulepreload" href="/app/family.js" />
<link rel="modulepreload" href="/app/helpers.js" />
<link rel="modulepreload" href="/app/history.js" />
<link rel="modulepreload" href="/app/push.js" />
<link rel="modulepreload" href="/app/settings.js" />
<link rel="modulepreload" href="/app/shell.js" />
<link rel="modulepreload" href="/app/state.js" />
<link rel="modulepreload" href="/app/tasks.js" />
<link rel="modulepreload" href="/app/today.js" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chores" />
</head>
<body>
<div id="app"></div>
<script src="/i18n.js"></script>
<script src="/boot.js"></script>
<script src="/qrcode.js"></script>
<script type="module" src="/app/main.js"></script>
</body>
</html>
